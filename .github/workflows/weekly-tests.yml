# 매주 월요일 05:00(KST)에 권한 테스트와 E2E 테스트를 돌린다. Actions 탭에서 직접 돌릴 수도 있다.
# E2E는 E2E 전용 Supabase 프로젝트(Repository secrets)에서만 돈다. 운영 프로젝트를 가리키면 시작 전에 멈춘다.
name: Weekly tests

on:
  schedule:
    - cron: "0 20 * * 0" # 일요일 20:00 UTC = 월요일 05:00 KST
  workflow_dispatch:

concurrency:
  group: e2e-db
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 권한 테스트 (RLS)
        run: npm run test:rls

      # playwright.config.ts와 마이그레이션 스크립트가 .env.e2e를 읽는다.
      # AXHUB_DATABASE_URL은 비워 둔다 (E2E에서 axhub 동기화를 돌리지 않는다).
      - name: .env.e2e 만들기
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TEST_LOGIN_SECRET: ${{ secrets.TEST_LOGIN_SECRET }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "AXHUB_DATABASE_URL="
            echo "CRON_SECRET=$CRON_SECRET"
            echo "TEST_LOGIN_SECRET=$TEST_LOGIN_SECRET"
          } > .env.e2e

      # 지난 실행 이후 추가된 마이그레이션을 E2E DB에 적용한다 (운영 프로젝트면 스크립트가 거부한다).
      - name: E2E DB 마이그레이션
        run: npm run db:migrate:e2e

      - run: npx playwright install --with-deps chromium

      - name: E2E 테스트
        run: npm run test:e2e

      - name: 실패한 테스트의 trace 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
